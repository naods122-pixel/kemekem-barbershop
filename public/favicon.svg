<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark background circle -->
  <circle cx="32" cy="32" r="32" fill="#09090b"/>
  <!-- Amber scissors icon (simplified) -->
  <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Scissors blade 1 -->
    <line x1="20" y1="20" x2="44" y2="44"/>
    <circle cx="18" cy="18" r="5" fill="none"/>
    <!-- Scissors blade 2 -->
    <line x1="44" y1="20" x2="20" y2="44"/>
    <circle cx="46" cy="18" r="5" fill="none"/>
    <!-- Handle lines -->
    <line x1="20" y1="44" x2="14" y2="52"/>
    <line x1="44" y1="44" x2="50" y2="52"/>
  </g>
</svg>
